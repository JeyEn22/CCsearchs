<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CCSearch Profile</title>
  <link rel="stylesheet" href="profile.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <div class="container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="logo">
        <img src="../image/Logo-removebg-preview.png" alt="Logo" />
        <h2>CCSearch</h2>
      </div>

      <nav class="nav">
        <a href="#" class="active">🏠 Home</a>
        <a href="#">👤 Profile</a>
        <a href="#">📚 My Library</a>
        <a href="#">📰 Publication</a>
        <a href="#">✍️ Authors</a>
        <a href="#">🔔 Notifications</a>
      </nav>

      <div class="logout">
        <a href="file:///C:/Users/John%20Nathaniel%20Batas/Downloads/CCsearch/login/login.html" id="logoutBtn">🚪 Logout</a>
      </div>
    </aside>

    <!-- Main Section with Background -->
    <main class="main">
      <section class="content">
        <!-- Profile Card -->
        <div class="profile-card">
          <div class="profile-image">
            <img src="../image/Logo.png" alt="User" id="profilePic">
            <label for="fileInput" class="camera-icon">
              <i class="fa fa-camera"></i>
            </label>
            <input type="file" id="fileInput" accept="image/*" hidden>
          </div>

          <h3>Nani Daski</h3>
          <p>Uploaded Documents: <strong>20</strong></p>
          <p>Viewed Documents: <strong>14</strong></p>
          <button id="viewPublic">View as Public</button>
        </div>

        <!-- Information Section -->
        <div class="info-section">
          <div class="tabs">
            <button class="tab active" data-tab="personal">Personal Information</button>
            <button class="tab" data-tab="account">Account Settings</button>
          </div>

          <div class="tab-content" id="personal">
            <div class="form-grid">
              <div class="form-group">
                <label>Last Name</label>
                <input type="text" value="Daski" />
              </div>
              <div class="form-group">
                <label>First Name</label>
                <input type="text" value="Nani" />
              </div>
              <div class="form-group">
                <label>Contact Number</label>
                <input type="text" value="09123456789" />
              </div>
              <div class="form-group">
                <label>Email Address</label>
                <input type="email" value="nani@example.com" />
              </div>
              <div class="form-group">
                <label>Current Address</label>
                <input type="text" value="123 Sample Street, Cav" />
              </div>
              <div class="form-group">
                <label>Department</label>
                <input type="text" value="Information Technology" />
              </div>
            </div>
            <div class="button-container">
              <button class="update">Update</button>
            </div>
          </div>

          <div class="tab-content hidden" id="account">
            <div class="form-grid">
              <div class="form-group">
                <label>Username</label>
                <input type="text" value="nani_d" />
              </div>
              <div class="form-group">
                <label>Password</label>
                <input type="password" value="********" />
              </div>
              <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" value="********" />
              </div>
            </div>
            <div class="button-container">
              <button class="update">Save Changes</button>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>
  <script src="profile.js"></script>
</body>
</html>
